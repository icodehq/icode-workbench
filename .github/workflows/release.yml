name: Release

# A tag push builds every installer and attaches it to that tag's GitHub
# Release. Run this manually to backfill a release for an existing tag — the
# tagged commit is checked out, not the branch that started the run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.7.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify installers
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve the release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            tag="$DISPATCH_TAG"
          else
            tag="$PUSHED_TAG"
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::release tag must start with v, got: $tag"; exit 1 ;;
          esac
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null ||
            { echo "::error::tag does not exist in this checkout: $tag"; exit 1; }
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release-assets/linux
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: release-assets/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release-assets/macos-arm64

      - name: Assemble release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # The notes come from the released commit's CHANGELOG, not this
          # workflow's ref, so the extraction is inline and tag-agnostic.
          awk -v version="$VERSION" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 {
              capture = 1
              next
            }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # Users download installers, not update metadata; skip the *.yml and
          # *.blockmap side files (their names also collide across Mac arches).
          mapfile -d '' assets < <(
            find release-assets -type f \
              \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
                 -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) \
              -print0 | sort -z
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no installers were produced"
            exit 1
          fi
          # Refuse a partial release: every platform job must have produced its
          # primary artifact, not merely exited successfully.
          for pattern in '*.AppImage' '*.deb' '*.rpm' '*.exe' \
                         '*-mac-x64.dmg' '*-mac-arm64.dmg' \
                         '*-mac-x64.zip' '*-mac-arm64.zip'; do
            if [ "$(find release-assets -type f -name "$pattern" | wc -l)" -eq 0 ]; then
              echo "::error::expected installer is missing: $pattern"
              exit 1
            fi
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "iCode $TAG" --notes-file release-notes.md
          else
            # Create as a draft so a failed upload never exposes a partial release.
            gh release create "$TAG" --verify-tag --draft \
              --title "iCode $TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" --clobber "${assets[@]}"
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false
          fi
