name: Telemetry audit

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: telemetry-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: No telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit dependencies and endpoints
        run: bash scripts/audit-telemetry.sh
