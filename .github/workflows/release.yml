name: Release

# A tag push builds every installer and attaches it to that tag's GitHub
# Release. Run this manually to backfill a release for an existing tag — the
# tagged commit is checked out, not the branch that started the run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.7.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify installers
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    # Signing secrets (WINDOWS_CSC_*, MACOS_CSC_*, APPLE_*) reach the package
    # jobs through the reusable workflow; without `inherit` release builds
    # would silently publish unsigned artifacts.
    secrets: inherit
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Resolve the release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            tag="$DISPATCH_TAG"
          else
            tag="$PUSHED_TAG"
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::release tag must start with v, got: $tag"; exit 1 ;;
          esac
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null ||
            { echo "::error::tag does not exist in this checkout: $tag"; exit 1; }
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release-assets/linux
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: release-assets/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release-assets/macos-arm64

      - name: Install metadata tooling
        run: |
          if [ -f config/scripts/merge-update-metadata.cjs ]; then
            pnpm install --frozen-lockfile --prod --ignore-scripts
          else
            echo "Legacy tag predates update metadata."
          fi

      - name: Assemble update metadata
        id: metadata
        run: |
          set -euo pipefail
          # A backfill of a tag that predates in-app updates has no updater
          # dependency and no metadata; publish its installers as before.
          if node -e "process.exit(require('./package.json').dependencies?.['electron-updater'] ? 0 : 1)"; then
            node config/scripts/merge-update-metadata.cjs \
              --root release-assets --output release-assets/metadata
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Legacy tag predates in-app updates; publishing installers only."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # The notes come from the released commit's CHANGELOG, not this
          # workflow's ref, so the extraction is inline and tag-agnostic.
          awk -v version="$VERSION" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 {
              capture = 1
              next
            }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          METADATA_ENABLED: ${{ steps.metadata.outputs.enabled }}
        run: |
          set -euo pipefail
          # Installers are public download targets; the metadata directory holds
          # the three channel files electron-updater reads. The raw per-arch
          # latest-mac.yml files are never uploaded: their names collide.
          mapfile -d '' assets < <(
            find release-assets -type f \
              \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
                 -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) \
              -print0 | sort -z
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no installers were produced"
            exit 1
          fi
          # Refuse a partial release: every platform job must have produced its
          # primary artifact, not merely exited successfully.
          for pattern in '*.AppImage' '*.deb' '*.rpm' '*.exe' \
                         '*-mac-x64.dmg' '*-mac-arm64.dmg' \
                         '*-mac-x64.zip' '*-mac-arm64.zip'; do
            if [ "$(find release-assets -type f -name "$pattern" | wc -l)" -eq 0 ]; then
              echo "::error::expected installer is missing: $pattern"
              exit 1
            fi
          done

          if [ "$METADATA_ENABLED" = "true" ]; then
            for name in latest.yml latest-linux.yml latest-mac.yml; do
              if [ ! -f "release-assets/metadata/$name" ]; then
                echo "::error::expected update metadata is missing: $name"
                exit 1
              fi
            done
            # Blockmaps are referenced by the channel files for differential
            # downloads (Windows NSIS and macOS zips; AppImage embeds its own).
            while IFS= read -r -d '' file; do
              assets+=("$file")
            done < <(
              find release-assets/windows release-assets/macos-x64 release-assets/macos-arm64 \
                -type f -name '*.blockmap' -print0 | sort -z
            )
            while IFS= read -r -d '' file; do
              assets+=("$file")
            done < <(find release-assets/metadata -type f -name '*.yml' -print0 | sort -z)
          fi

          prerelease=false
          case "$TAG" in
            *-*) prerelease=true ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$prerelease" = "true" ]; then
              gh release edit "$TAG" --title "iCode $TAG" --notes-file release-notes.md --prerelease
            else
              gh release edit "$TAG" --title "iCode $TAG" --notes-file release-notes.md
            fi
          else
            # Create as a draft so a failed upload never exposes a partial release.
            # A prerelease tag must not become GitHub's `latest`, or stable
            # clients would read a version the feed intentionally rejects.
            if [ "$prerelease" = "true" ]; then
              gh release create "$TAG" --verify-tag --draft --prerelease \
                --title "iCode $TAG" --notes-file release-notes.md
            else
              gh release create "$TAG" --verify-tag --draft \
                --title "iCode $TAG" --notes-file release-notes.md
            fi
          fi
          gh release upload "$TAG" --clobber "${assets[@]}"
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false
          fi
