name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  unit-linux:
    name: Unit and build (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - name: Configure Git for tests
        run: |
          git config --global user.name "iCode CI"
          git config --global user.email "ci@icode.invalid"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git config --global protocol.file.allow always
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:brand
      - run: pnpm test
      - run: pnpm build

  unit-windows:
    name: Unit and build (Windows)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Configure Git for tests
        run: |
          git config --global user.name "iCode CI"
          git config --global user.email "ci@icode.invalid"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git config --global protocol.file.allow always
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:brand
      - run: pnpm test
      - run: pnpm build

  unit-macos:
    name: Unit and build (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VITEST_MAX_WORKERS: '2'
      VITEST_TEST_TIMEOUT: '15000'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Configure Git for tests
        run: |
          git config --global user.name "iCode CI"
          git config --global user.email "ci@icode.invalid"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git config --global protocol.file.allow always
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:brand
      - run: pnpm test
      - run: pnpm build

  package-linux:
    name: Package (Linux x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: unit-linux
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Packaging prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 rpm
      - run: pnpm install --frozen-lockfile
      - name: Package AppImage, deb, and rpm
        run: pnpm package:linux
      - name: Verify packaged payload
        run: node config/scripts/verify-package.cjs --platform linux --arch x64 --dir dist/linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  wsl-artifacts:
    name: WSL Host artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:host
      - run: pnpm build:wsl-host
      - run: pnpm verify:wsl-host
      - run: pnpm selftest:wsl-host
      - run: pnpm selftest:wsl-prepare
      - uses: actions/upload-artifact@v4
        with:
          name: wsl-host-linux-x64
          path: artifacts/wsl-host/linux-x64
          if-no-files-found: error

  package-windows:
    name: Package (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 45
    needs: [unit-windows, wsl-artifacts]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wsl-host-linux-x64
          path: artifacts/wsl-host/linux-x64
      - name: Package NSIS
        run: pnpm package:win
      - name: Verify packaged payload
        run: node config/scripts/verify-package.cjs --platform win --arch x64 --dir dist/win-unpacked
      - name: Packaged smoke
        run: node tests/compat/packaged-smoke-win.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.exe.blockmap
          if-no-files-found: error

  package-macos:
    name: Package (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: unit-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            unpacked: dist/mac
          - runner: macos-15
            arch: arm64
            unpacked: dist/mac-arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build application
        run: pnpm build
      - name: Package dmg and zip
        run: node config/scripts/package.cjs mac --${{ matrix.arch }}
      - name: Verify packaged payload
        run: node config/scripts/verify-package.cjs --platform mac --arch ${{ matrix.arch }} --dir ${{ matrix.unpacked }}
      - name: Inspect packaged app
        run: |
          ls -leO@ "${{ matrix.unpacked }}/iCode.app/Contents/MacOS" || true
          file "${{ matrix.unpacked }}/iCode.app/Contents/MacOS/iCode" || true
          codesign -dv --verbose=4 "${{ matrix.unpacked }}/iCode.app" 2>&1 || true
          codesign -dv --verbose=4 "${{ matrix.unpacked }}/iCode.app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-${{ matrix.arch }}/spawn-helper" 2>&1 || true
          spctl -a -vv "${{ matrix.unpacked }}/iCode.app" 2>&1 || true
      - name: Packaged smoke
        run: node tests/compat/packaged-smoke-mac.cjs --app ${{ matrix.unpacked }}/iCode.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error
