name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  unit-linux:
    name: Unit and build (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:brand
      - run: pnpm test
      - run: pnpm build

  unit-windows:
    name: Unit and build (Windows)
    runs-on: windows-2022
    timeout-minutes: 30
    # Phase 3 makes the Windows suite blocking. Keep the job recording results
    # while the known POSIX-only tests are still being converted.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:brand
      - run: pnpm test
      - run: pnpm build

  package-linux:
    name: Package (Linux x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: unit-linux
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Packaging prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 rpm
      - run: pnpm install --frozen-lockfile
      - name: Package AppImage, deb, and rpm
        run: pnpm package:linux
      - name: Verify packaged payload
        run: node config/scripts/verify-package.cjs --platform linux --arch x64 --dir dist/linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
